name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: macos-latest
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Check flake outputs
        run: nix flake check --no-build

      - name: Build home configuration
        # Upstream source mirrors occasionally return transient 503/504
        # (e.g. terraform 1.16.0 in run 42478593378). Retry to ride them out.
        run: |
          for attempt in 1 2 3; do
            if nix build --no-link --print-out-paths \
              '.#homeConfigurations."TetsuonoMacBook-Pro-${{ matrix.system }}".activationPackage'; then
              exit 0
            fi
            echo "Build attempt $attempt failed, retrying in 30s..."
            sleep 30
          done
          exit 1
