                  - generic [ref=f13e3333]: "43"
                  - generic [ref=f13e3339]: This has to happen before anything else reads the toolkit, so keep it at the top of the module, above the Traits and Mayavi imports.
                - generic [ref=f13e3348]:
                  - checkbox
              - generic [ref=f13e3352] [cursor=pointer]:
                - generic [ref=f13e3354]:
                  - generic [ref=f13e3355]: "45"
                  - generic [ref=f13e3361]: "TraitsUI pushes wx event handlers onto the panel it builds and onto its children, and pops them only in ``ui.dispose()``, which never runs for a frame that is simply closed; wx then asserts on destroying a window that still has one. Popping them as above is enough, and only over the panel TraitsUI built -- calling ``dispose()`` here instead schedules a second ``Destroy`` through ``wx.CallAfter``, and popping over widgets of your own removes handlers wx installed for itself. Both crash on close."
                - generic [ref=f13e3370]:
                  - checkbox
              - generic [ref=f13e3374] [cursor=pointer]:
                - generic [ref=f13e3376]:
                  - generic [ref=f13e3377]: "46"
                  - generic [ref=f13e3383]: "Pass the container the panel is going into as ``parent``, not the frame around it: a widget handed to a Qt layout is reparented for you, while wx expects it to be a child of the container already. Putting a Mayavi view in a notebook page therefore means ``parent=self.notebook`` -- with the frame as parent the page can come out mis-drawn, and recent wxWidgets assert on it outright rather than reparenting quietly as older ones did."
                - generic [ref=f13e3392]:
                  - checkbox
