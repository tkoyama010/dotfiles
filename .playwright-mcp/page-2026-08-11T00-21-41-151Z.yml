                                    - generic [ref=f13e3549]: "42"
                                    - generic [ref=f13e3556]:
                                        - generic [ref=f13e3557]: "Before defining the `Visualization` class, you should set the toolkit used by Traits to the Wx backend, as it otherwise prefers Qt when both are installed and `edit_traits` then hands you a Qt widget that no wx sizer will accept::"
                                        - generic [ref=f13e3563]: "`Visualization` クラスを定義する前に，Traitsが使用するツールキットをWxバックエンドに設定する必要があります．そうしないと，両方がインストールされている場合はQtが優先され， `edit_traits` はwx sizerが受け付けないQtウィジェットを返します．"
                                - generic [ref=f13e3568]:
                                    - checkbox
                            - generic [ref=f13e3658] [cursor=pointer]:
                                - generic [ref=f13e3660]:
                                    - generic [ref=f13e3661]: "43"
                                    - generic [ref=f13e3668]:
                                        - generic [ref=f13e3669]: This has to happen before anything else reads the toolkit, so keep it at the top of the module, above the Traits and Mayavi imports.
                                        - generic [ref=f13e3671]: これは他の何かがツールキットを読み込む前に行う必要があるため，モジュールの先頭，TraitsとMayaviのインポートの前に置いてください．
                                - generic [ref=f13e3676]:
                                    - checkbox
                            - generic [ref=f13e3772] [cursor=pointer]:
                                - generic [ref=f13e3774]:
                                    - generic [ref=f13e3775]: "45"
                                    - generic [ref=f13e3782]:
                                        - generic [ref=f13e3783]: "TraitsUI pushes wx event handlers onto the panel it builds and onto its children, and pops them only in ``ui.dispose()``, which never runs for a frame that is simply closed; wx then asserts on destroying a window that still has one. Popping them as above is enough, and only over the panel TraitsUI built -- calling ``dispose()`` here instead schedules a second ``Destroy`` through ``wx.CallAfter``, and popping over widgets of your own removes handlers wx installed for itself. Both crash on close."
                                        - generic [ref=f13e3785]: "TraitsUIは，構築したパネルとその子要素にwxイベントハンドラをプッシュし， ``ui.dispose()`` 内でのみポップしますが，単に閉じられたフレームに対しては実行されません．wxは，まだハンドラを持っているウィンドウを破棄するとアサートします．上記のようにポップするだけで十分であり，TraitsUIが構築したパネル上でのみ行います．ここで ``dispose()`` を呼び出すと， ``wx.CallAfter`` による2回目の ``Destroy`` がスケジュールされ，独自のウィジェット上でポップするとwx自身がインストールしたハンドラが削除されます．どちらもクローズ時にクラッシュします．"
                                - generic [ref=f13e3790]:
                                    - checkbox
                            - generic [ref=f13e3793] [cursor=pointer]:
                                - generic [ref=f13e3795]:
                                    - generic [ref=f13e3796]: "46"
                                    - generic [ref=f13e3802]: "Pass the container the panel is going into as ``parent``, not the frame around it: a widget handed to a Qt layout is reparented for you, while wx expects it to be a child of the container already. Putting a Mayavi view in a notebook page therefore means ``parent=self.notebook`` -- with the frame as parent the page can come out mis-drawn, and recent wxWidgets assert on it outright rather than reparenting quietly as older ones did."
