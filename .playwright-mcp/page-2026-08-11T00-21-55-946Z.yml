                - generic [ref=f13e3980]:
                  - generic [ref=f13e3981]: "31"
                  - generic [ref=f13e3987]: "On all supported platforms off screen rendering should work out of the box, provided the machine can create an OpenGL context at all. A quick check::"
                - generic [ref=f13e3996]:
                  - checkbox
              - generic [ref=f13e4000] [cursor=pointer]:
                - generic [ref=f13e4002]:
                  - generic [ref=f13e4003]: "32"
                  - generic [ref=f13e4009]: If this produces a clean image -- even if you switch desktops or cover any windows produced -- you are all set.
                - generic [ref=f13e4018]:
                  - checkbox
              - generic [ref=f13e4022] [cursor=pointer]:
                - generic [ref=f13e4024]:
                  - generic [ref=f13e4025]: "33"
                  - generic [ref=f13e4031]: "On Linux this needs *some* way to get a context: either an X server (a real one or a virtual framebuffer, see below), or one of the headless OpenGL backends VTK ships with, EGL and OSMesa. Mayavi does not choose between them; it creates a plain render window and lets VTK's own factory pick, which means the display is used when there is one and EGL or OSMesa is used when there is not. See :ref:`choosing_the_opengl_backend` if you need to override that."
                - generic [ref=f13e4040]:
                  - checkbox
              - generic [ref=f13e4044] [cursor=pointer]:
                - generic [ref=f13e4046]:
                  - generic [ref=f13e4047]: "48"
                  - generic [ref=f13e4053]: Choosing the OpenGL backend
                - generic [ref=f13e4062]:
                  - checkbox
              - generic [ref=f13e4066] [cursor=pointer]:
                - generic [ref=f13e4068]:
                  - generic [ref=f13e4069]: "49"
                  - generic [ref=f13e4075]: "Sometimes you want to run Mayavi/VTK completely headless on a machine with no X server at all. The VTK wheels on PyPI are built with EGL and OSMesa support alongside the usual X11 one, so nothing has to be rebuilt for this: set ``ETS_TOOLKIT='null'`` and ``mlab.options.offscreen = True`` and it will work with no display."
                - generic [ref=f13e4084]:
                  - checkbox
              - generic [ref=f13e4088] [cursor=pointer]:
                - generic [ref=f13e4090]:
                  - generic [ref=f13e4091]: "50"
                  - generic [ref=f13e4097]: "VTK decides which of its backends to use, in this order: the one named by the ``VTK_DEFAULT_OPENGL_WINDOW`` environment variable if it is set, otherwise the platform's native window (X11 on Linux), then EGL, then OSMesa, keeping the first one that manages to initialize. Mayavi deliberately does not second-guess that, so the same rules apply to off screen scenes as to on screen ones."
                - generic [ref=f13e4106]:
                  - checkbox
              - generic [ref=f13e4110] [cursor=pointer]:
                - generic [ref=f13e4112]:
                  - generic [ref=f13e4113]: "51"
                  - generic [ref=f13e4119]: "To force a particular backend, set the variable before importing Mayavi::"
                - generic [ref=f13e4128]:
                  - checkbox
              - generic [ref=f13e4132] [cursor=pointer]:
                - generic [ref=f13e4134]:
                  - generic [ref=f13e4135]: "52"
                  - generic [ref=f13e4141]: "EGL is the one to pick for headless rendering on a machine with a GPU; it needs a working EGL driver installed, which slim container images often lack even when they do have ``libgl1``. OSMesa renders purely in software, so it needs no driver and no display at all, at the cost of speed."
                - generic [ref=f13e4150]:
                  - checkbox
              - generic [ref=f13e4154] [cursor=pointer]:
                - generic [ref=f13e4156]:
                  - generic [ref=f13e4157]: "82"
