                  - generic [ref=f13e3959]: "25"
                  - generic [ref=f13e3965]: "This will run the script in an offscreen, standalone window. For more details on the command line arguments supported by the ``mayavi2`` application, see the :ref:`command-line-arguments` section."
                - generic [ref=f13e3974]:
                  - checkbox
